[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylikwid"
version = "0.4.2"
description = "A Python module to access the function of the LIKWID library"
authors = [
    { name = "Thomas Roehl", email = "thomas.roehl@googlemail.com" }
]
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.7"
keywords = ["hpc", "performance", "benchmark", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/RRZE-HPC/pylikwid"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pylikwid"]
package-dir = {"" = "src"}
