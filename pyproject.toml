[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylikwid"
version = "0.4.2"
description = "A Python module to access the function of the LIKWID library"
authors = [
    { name = "Thomas Roehl", email = "thomas.roehl@googlemail.com" }
]
readme = "README.rst"
license = { file = "LICENSE" }
url = "https://github.com/RRZE-HPC/pylikwid"
requires-python = ">=3.7"

[tool.setuptools]
packages = ["pylikwid"]
package-dir = {"" = "src"}


[tool.setuptools.ext_modules]
name = "pylikwid.pylikwid"
sources = ["src/pylikwid/pylikwid.c"]

[project.optional-dependencies]
test = ["pytest"]
